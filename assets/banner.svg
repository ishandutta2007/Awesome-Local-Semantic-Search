<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.45; }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    
    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }

    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    .ambient-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .float-slow {
      animation: floatPillSlow 5s ease-in-out infinite;
    }

    .float-reverse {
      animation: floatPillReverse 6s ease-in-out infinite;
    }

    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashMove 3s linear infinite;
    }

    .radar-circle {
      transform-origin: 600px 180px;
      animation: radarSweep 20s linear infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Subtle Perspective Grid -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
  </g>

  <!-- Ambient Pulsing Background Orbs -->
  <circle cx="600" cy="180" r="280" fill="url(#ambientOrb)" class="ambient-orb"/>
  <circle cx="150" cy="80" r="140" fill="url(#ambientOrb)" class="ambient-orb" style="animation-delay: -2s;"/>
  <circle cx="1050" cy="280" r="160" fill="url(#ambientOrb)" class="ambient-orb" style="animation-delay: -4s;"/>

  <!-- Dynamic Vector Graph & Constellation in Background (Behind Text) -->
  <g opacity="0.6">
    <!-- Connecting dashed streams -->
    <path d="M 120 180 Q 300 80 500 130" stroke="#38bdf8" stroke-width="1.5" fill="none" class="stream-line" opacity="0.4"/>
    <path d="M 700 230 Q 900 280 1080 180" stroke="#c084fc" stroke-width="1.5" fill="none" class="stream-line" opacity="0.4"/>
    
    <!-- Vector Orbit Ring -->
    <ellipse cx="600" cy="180" rx="380" ry="110" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.25" class="radar-circle"/>
  </g>

  <!-- Floating Feature Pills (Safely Placed on Top & Bottom Periphery to Never Overlap Titles) -->
  <g class="float-slow" filter="url(#pillShadow)">
    <!-- Pill 1: Top Left -->
    <g transform="translate(60, 35)">
      <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="22" cy="17" r="6" fill="#38bdf8"/>
      <text x="36" y="22" class="badge-text">⚡ 100% Local-First</text>
    </g>
    <!-- Pill 2: Top Right -->
    <g transform="translate(940, 35)">
      <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="22" cy="17" r="6" fill="#818cf8"/>
      <text x="36" y="22" class="badge-text">🔒 Zero Data Retention</text>
    </g>
  </g>

  <g class="float-reverse" filter="url(#pillShadow)">
    <!-- Pill 3: Bottom Left -->
    <g transform="translate(80, 295)">
      <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9"/>
      <circle cx="22" cy="17" r="6" fill="#a855f7"/>
      <text x="36" y="22" class="badge-text">🧠 Multimodal Vectors</text>
    </g>
    <!-- Pill 4: Bottom Right -->
    <g transform="translate(920, 295)">
      <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9"/>
      <circle cx="22" cy="17" r="6" fill="#34d399"/>
      <text x="36" y="22" class="badge-text">🚀 Hybrid BM25 + RAG</text>
    </g>
  </g>

  <!-- Central Foreground Content (High Contrast, Crystal Clear, Never Obscured) -->
  <!-- Subtle Gradient Accent Line above Title -->
  <rect x="520" y="86" width="160" height="4" rx="2" fill="url(#primaryGlow)" filter="url(#glowEffect)"/>

  <!-- Primary Title with High Visibility -->
  <text x="600" y="150" text-anchor="middle" class="title-text">
    Awesome Local Semantic Search
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="194" text-anchor="middle" class="subtitle-text">
    Curated Ecosystem of On-Device Search Engines, Multimodal Embeddings &amp; Local RAG
  </text>

  <!-- Subtitle Line 2 / Technology Tags -->
  <text x="600" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
    EMBEDDINGS • VECTOR SEARCH • HYBRID BM25 • PRIVATE RETRIEVAL • RAG
  </text>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGlow)" rx="2"/>
</svg>
